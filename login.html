<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Aurelia</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cart.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-bg"></div>
  <div class="auth-card">
    <div class="auth-logo"><span>AUR<em>ELIA</em></span></div>
    <h2>Welcome Back</h2>
    <p class="sub">Sign in to continue to your account</p>

    <form id="loginForm" novalidate>
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
        <span class="error-msg">Enter a valid email address</span>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
        <span class="toggle-pass">👁</span>
        <span class="error-msg">Password must be at least 6 characters</span>
      </div>
      <div class="auth-row">
        <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="rememberMe"> Remember me</label>
        <a href="#" id="forgotPasswordLink">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-gold btn-block ripple">Sign In</button>
    </form>

    <div class="auth-divider">or continue with</div>
    <div class="auth-socials">
      <button onclick="showToast('Google sign-in demo only')">Google</button>
      <button onclick="showToast('Apple sign-in demo only')">Apple</button>
    </div>

    <p class="auth-footer-link">Don't have an account? <a href="signup.html">Create one</a></p>
  </div>
</div>

<div id="toastContainer"></div>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
