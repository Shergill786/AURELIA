<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Aurelia</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cart.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-bg"></div>
  <div class="auth-card">
    <div class="auth-logo"><span>AUR<em>ELIA</em></span></div>
    <h2>Create Account</h2>
    <p class="sub">Join Aurelia for a personalised shopping experience</p>

    <form id="signupForm" novalidate>
      <div class="auth-field">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Jane Doe">
        <span class="error-msg">Enter your full name</span>
      </div>
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@example.com">
        <span class="error-msg">Enter a valid email address</span>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Minimum 8 characters">
        <span class="toggle-pass">👁</span>
        <div class="strength-meter"><i></i></div>
        <span class="error-msg">Password must be at least 8 characters</span>
      </div>
      <div class="auth-field">
        <label>Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Re-enter password">
        <span class="toggle-pass">👁</span>
        <span class="error-msg">Passwords do not match</span>
      </div>
      <div class="auth-row">
        <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="agreeTerms"> I agree to the Terms & Privacy Policy</label>
      </div>
      <button type="submit" class="btn btn-gold btn-block ripple">Create Account</button>
    </form>

    <div class="auth-divider">or sign up with</div>
    <div class="auth-socials">
      <button onclick="showToast('Google sign-up demo only')">Google</button>
      <button onclick="showToast('Apple sign-up demo only')">Apple</button>
    </div>

    <p class="auth-footer-link">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<div id="toastContainer"></div>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
